<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>페이지를 찾지 못했습니다 | Lambency</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/blog/style.css">
<style>
  .nf{max-width:640px;margin:14vh auto;padding:0 24px}
  .nf h1{font-family:var(--serif,'Cormorant Garamond',serif);font-weight:400;font-size:30px;margin:0 0 14px}
  .nf p{font-family:var(--kr,'Source Serif 4',serif);font-size:15px;line-height:1.85;margin:0 0 10px}
  .nf .path{font-family:var(--mono,'IBM Plex Mono',monospace);font-size:12px;
    color:var(--ink-faint,#8a8378);word-break:break-all;margin:0 0 26px}
  .nf a{color:inherit;text-decoration:none;border-bottom:1px solid currentColor}
</style>
</head>
<body>
<div class="nf">
  <h1>페이지를 찾지 못했습니다</h1>
  <p>주소가 바뀌었거나, 없는 문서입니다.</p>
  <p class="path" id="p"></p>
  <p><a href="/">처음으로</a> · <a href="/blog/">글 목록</a></p>
</div>
<script>
/* 🔴 «동네 경로» 폴백 (2026-08-30)
   툴 페이지들은 «어느 동네를 봤나» 를 집계하려고 주소를 /blog/wolse/<구>/<동> 로 바꾼다
   (Cloudflare Web Analytics 는 경로만 세고 해시·쿼리는 잘라 버리므로 — 실측으로 확인).
   그 주소로 새로고침·공유 진입하면 실제 파일이 없어 여기로 온다. 해시에 실어 툴로 돌려보낸다.
   되돌릴 때 예쁜 경로로 다시 안 바꾼다 — 그러면 같은 동네가 두 번 세어진다. */
(function(){
  var TOOLS = {wolse:1, where:1, sangkwon:1, cheongyak:1};
  var m = location.pathname.match(/^\/blog\/([a-z]+)\/(.+)$/);
  if (m && TOOLS[m[1]]) {
    location.replace('/blog/' + m[1] + '.html#' + m[2].replace(/\/+$/, ''));
    return;
  }
  document.getElementById('p').textContent = location.pathname;
})();
</script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "41e57f5bc21948e5b31967d7e66641e7"}'></script>
</body>
</html>
