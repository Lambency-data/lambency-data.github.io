# GitHub Pages 빌드 설정 (2026-08-27 신설)
#
# 🔴 왜 만들었나 — 이 리포는 **루트가 곧 사이트 루트**라 «git 추적 = 인터넷 공개» 였다.
#    → Jekyll 의 exclude 로 빌드 대상에서 뺀다.
#
# 🔴 2026-09-07 — exclude 만으로는 부족하다. 이 리포는 PUBLIC 이라
#    exclude 는 Pages «서빙» 만 막고 raw.githubusercontent.com 접근은 못 막는다
#    (실측: 추적 중이던 LOG.md 가 raw 200). **내부 문서는 추적하지 않는다** 로 되돌렸다.
#
# ⚠ 이 파일이 생기면서 .nojekyll 을 지웠다 — Jekyll 빌드가 켜진다.
#   안전 확인(2026-08-27 실측): HTML·JSON 에 Liquid 구문({{ · {%) 0건 ·
#   «_» 로 시작하는 파일·폴더 0건. 즉 Jekyll 이 건드릴 게 없다.
#   🔴 앞으로 HTML 에 {{ }} 를 쓰면 Liquid 가 삼킨다 — 쓸 일이 생기면 {% raw %} 로 감쌀 것.

# 🔴 추적되지 않는 파일은 여기 적지 않는다 (2026-09-07) — 리포에 없으니 exclude 가
#    필요 없고, 이름만 적어 두면 «내부 문서가 무엇무엇 있다» 를 공개로 알려 주는 셈이다.
exclude:
  - README.md
