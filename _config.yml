# GitHub Pages 빌드 설정 (2026-08-27 신설)
#
# 🔴 왜 만들었나 — 이 리포는 **루트가 곧 사이트 루트**라 «git 추적 = 인터넷 공개» 였다.
#    실측(2026-08-07·2026-08-27 재확인): README.md(추적) HTTP 200 / DEPLOY.md(ignored) 404.
#    그래서 내부 문서를 전부 .gitignore 로 막아 왔는데, 그러면 **버전 추적이 안 된다** —
#    LOG.md 가 로컬에만 쌓여 git log 로 «언제 무엇과 함께 바뀌었나» 를 따라갈 수 없었다.
#    → Jekyll 의 exclude 로 **추적은 하되 빌드에서 빼서** 둘 다 얻는다.
#
# ⚠ 이 파일이 생기면서 .nojekyll 을 지웠다 — Jekyll 빌드가 켜진다.
#   안전 확인(2026-08-27 실측): HTML·JSON 에 Liquid 구문({{ · {%) 0건 ·
#   «_» 로 시작하는 파일·폴더 0건. 즉 Jekyll 이 건드릴 게 없다.
#   🔴 앞으로 HTML 에 {{ }} 를 쓰면 Liquid 가 삼킨다 — 쓸 일이 생기면 {% raw %} 로 감쌀 것.

exclude:
  - LOG.md               # 코드·디자인·배포 사고 이력 (젠틀몬스터 실명 등 내부 판단 포함)
  - DEPLOY.md            # 내부 배포 체크리스트·미결 판단
  - EN-KO-대조본.md       # 내부 카피 검토용
  - 인계.md               # 세션 인계문
  - 픽업_프롬프트.md       # 내부 프롬프트
  - blog/편집원칙.md       # 아웃리치 보호 대상 명단
  - blog/집필_방법론.md    # 집필 절차서
  - blog/research/        # 검증 스크립트·원자료
  - tools/               # 로컬 도구 (사이트 자산 아님)
  - assets/og-generate.py
  - README.md            # 리포 설명 — 사이트 방문자에게 보일 이유가 없다
