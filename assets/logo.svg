<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" role="img" aria-label="Lambency — Vires acquirit eundo">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f9e7b8" stop-opacity=".5"/>
      <stop offset="45%" stop-color="#eec06a" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#c98a2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="needle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf3d7"/>
      <stop offset="100%" stop-color="#eec06a"/>
    </linearGradient>
  </defs>

  <!-- mark: 일렁이는 베젤 — 촛불의 흔들림(아크 4개, 나선 리듬)이 나침반 베젤이 되고 그 안에 바늘. 위 눈금 = 북쪽 -->
  <g transform="translate(180,118)">
    <circle r="62" fill="url(#glow)"/>
    <path d="M 12.86 -15.32 A 20 20 0 0 1 10 17.32" fill="none" stroke="#f5d489" stroke-width="1.8" stroke-linecap="round" opacity=".95"/>
    <path d="M 5.04 28.56 A 29 29 0 0 1 -28.01 -7.51" fill="none" stroke="#f2cf8a" stroke-width="1.5" stroke-linecap="round" opacity=".55"/>
    <path d="M -35.51 -20.5 A 41 41 0 0 1 38.53 -14.02" fill="none" stroke="#eec06a" stroke-width="1.15" stroke-linecap="round" opacity=".32"/>
    <path d="M 56 0 A 56 56 0 0 1 -48.5 28" fill="none" stroke="#e8b458" stroke-width=".85" stroke-linecap="round" opacity=".15"/>
    <line x1="0" y1="-63" x2="0" y2="-55" stroke="#fdf3d7" stroke-width="1.4" stroke-linecap="round" opacity=".9"/>
    <g transform="rotate(35)">
      <path d="M 0 -21 L 3.6 2.2 L -3.6 2.2 Z" fill="url(#needle)"/>
      <path d="M 0 12 L 2.6 2.2 L -2.6 2.2 Z" fill="#c98a2e" opacity=".6"/>
    </g>
    <circle r="4.6" fill="none" stroke="#ece5d8" stroke-width=".9" opacity=".5"/>
    <circle r="2.2" fill="#fdf3d7"/>
  </g>

  <!-- wordmark + motto (Georgia/serif fallback — 웹에서는 Cormorant Garamond 로드) -->
  <text x="180" y="238" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif"
        font-size="26" letter-spacing="9" fill="#ece5d8">LAMBENCY</text>
  <text x="180" y="264" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif"
        font-style="italic" font-size="11" letter-spacing="3.5" fill="#a89e8a">VIRES ACQUIRIT EUNDO</text>
</svg>
